<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wine Shop Stock Manager</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#17202a;--muted:#68727d;--line:#e5e7eb;--accent:#173f5f;--good:#147d4f;--warn:#a66b00;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--accent);color:#fff;padding:22px 18px 18px;position:sticky;top:0;z-index:5}
h1{font-size:22px;margin:0 0 4px}h2{font-size:20px;margin:0 0 14px}h3{margin:0 0 10px}.sub{opacity:.82;font-size:13px}
main{max-width:1100px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 2px 8px #00000008}
.shop{cursor:pointer;transition:.15s}.shop:hover{transform:translateY(-2px);box-shadow:0 8px 22px #00000012}
.big{font-size:26px;font-weight:750}.muted{color:var(--muted)}button,select,input{font:inherit}
button{border:0;border-radius:10px;padding:10px 13px;cursor:pointer;background:var(--accent);color:#fff}
button.secondary{background:#eef2f5;color:var(--text)}button.danger{background:#b42318}.actions{display:flex;gap:8px;flex-wrap:wrap}
.back{background:transparent;color:#fff;padding:4px 0;margin-bottom:8px}
.breadcrumb{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:14px;color:var(--muted);font-size:14px}
.months,.dates{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer}
.tile strong{display:block}.tile small{color:var(--muted)}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{width:100%;border-collapse:collapse;min-width:920px}th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;font-size:13px;white-space:nowrap}th{background:#f1f4f6;position:sticky;top:0}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:inherit;z-index:1}
td input{width:85px;padding:7px;border:1px solid #d6dae0;border-radius:7px}td .itemname{font-weight:650}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.kpi b{font-size:20px;display:block;margin-top:4px}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}.good{background:#e6f5ee;color:var(--good)}.warn{background:#fff2d8;color:var(--warn)}.bad{background:#fde9e7;color:var(--bad)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.toolbar select,.toolbar input{padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.modalbox{background:#fff;border-radius:16px;max-width:500px;width:100%;padding:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid label{font-size:12px;color:var(--muted)}.formgrid input,.formgrid select{width:100%;padding:9px;border:1px solid #d6dae0;border-radius:8px;margin-top:4px}.full{grid-column:1/-1}
.note{padding:11px 13px;background:#eef5fb;border-radius:10px;font-size:13px;margin:12px 0}
.empty{padding:28px;text-align:center;color:var(--muted)}
</style>

let items=[];
itemsRaw.forEach(([name,sizes])=>sizes.split(",").forEach(size=>items.push({id:(crypto.randomUUID ? crypto.randomUUID() : (Date.now()+Math.random()).toString(36)),name:name.trim(),size:size.trim(),active:true})));

const key="wineShopPrototypeV1";
let state=null; try { state=JSON.parse(localStorage.getItem(key)||"null"); } catch(e) { state=null; }
if(!state){
 state={items, records:{}, transfers:[], expenses:[]};
 save();
}else{
 items=state.items;

function save(){state.items=items; try { localStorage.setItem(key,JSON.stringify(state)); } catch(e) {} }
function money(n){return "₹"+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2})}
function recKey(shop,date){return shop+"|"+date}
function getRecord(shop,date){
 const k=recKey(shop,date);
 if(!state.records[k]) state.records[k]={};
 return state.records[k];
}
function months(){
 return ["January","February","March","April","May","June","July","August","September","October","November","December"];
}
function daysInMonth(m){return new Date(new Date().getFullYear(),months().indexOf(m)+1,0).getDate()}
function renderHeader(){
 let title=view.screen==="home"?"Wine Shop Stock Manager":view.shop||"";
 document.getElementById("headerContent").innerHTML=(view.screen!=="home"?`<button class="back" onclick="goBack()">‹ Back</button>`:"")+`<h1>${title}</h1><div class="sub">Inventory • Sales • Transfers • Profit</div>`;
}
function render(){
 renderHeader(); const app=document.getElementById("app");
 if(view.screen==="home") return home(app);
 if(view.screen==="shop") return shop(app);
 if(view.screen==="month") return month(app);
if(view.screen==="monthdates") return monthdates(app);
if(view.screen==="day") return day(app);
 if(view.screen==="reports") return reports(app);
 if(view.screen==="items") return itemManager(app);
 if(view.screen==="transfers") return transfers(app);
}
function home(a){
 a.innerHTML=`<div class="grid">${shops.map((s,i)=>`<div class="card shop" onclick="openShop('${s.replace(/'/g,"\\'")}')"><div class="muted">SHOP ${i+1}</div><div class="big">${s}</div><p class="muted">Months → Dates → Daily records</p></div>`).join("")}</div>
<div class="grid" style="margin-top:14px">
 <div class="card shop" onclick="view.screen='reports';render()"><h3>📊 Overall Reports</h3><p class="muted">Today, week, month and custom reports</p></div>
 <div class="card shop" onclick="view.screen='items';render()"><h3>➕ Items & Stock</h3><p class="muted">Add or manage products and sizes</p></div>
 <div class="card shop" onclick="view.screen='transfers';render()"><h3>🔄 Stock Transfers</h3><p class="muted">Move stock between the 4 shops</p></div>
</div>
<div class="note">Your initial item list from the uploaded register photos is loaded as a starting point. You can add new items anytime.</div>`;
}
function openShop(s){view={screen:"month",shop:s};render()}
function shop(a){view.screen="month";month(a)}
function month(a){
 a.innerHTML=`<div class="breadcrumb">${view.shop} <span>›</span> Select Month</div><div class="months">${months().map(m=>`<div class="tile" onclick="view.month='${m}';view.screen='monthdates';render()"><strong>📅 ${m}</strong><small>Open daily records</small></div>`).join("")}</div>`;

}
function goBack(){if(view.screen==="day"){view.screen="monthdates"}else if(view.screen==="monthdates"){view.screen="month"}else if(view.screen==="month"){view.screen="home"}else view.screen="home";render()}
function day(a){
 const rec=getRecord(view.shop,view.date);
 const shopIndex=shops.indexOf(view.shop);
 const previousDate=getPreviousDate(view.date);
 const rows=items.filter(x=>x.active).map(it=>{
   const r=rec[it.id]||{};
   const opening = r.opening!==undefined ? r.opening : previousClosing(it.id,view.shop,view.date);
   const received=+r.received||0,sold=+r.sold||0,purchase=+r.purchase||0,sale=+r.sale||0,transferOut=+r.transferOut||0;
   const closing=opening+received-sold-transferOut;
   const profit=sale-(sold*purchase);
   return {it,r,opening,received,sold,purchase,sale,closing,profit};
 });
 const totals=rows.reduce((o,x)=>{o.sold+=x.sold;o.sale+=x.sale;o.profit+=x.profit;o.stock+=x.closing;return o},{sold:0,sale:0,profit:0,stock:0});
 a.innerHTML=`<div class="breadcrumb">${view.shop} › ${view.date}</div>
 <div class="actions"><button onclick="addItemModal()">➕ Add Item</button><span id="autosaveStatus" class="badge good" style="margin-left:4px">✓ Auto-saved</span><button class="secondary" onclick="view.screen='transfers';render()">🔄 Transfer Stock</button><button class="secondary" onclick="view.screen='reports';render()">📊 Reports</button></div>
 <div class="kpis"><div class="kpi">Sold<b>${totals.sold}</b></div><div class="kpi">Actual Sales<b>${money(totals.sale)}</b></div><div class="kpi">Profit<b>${money(totals.profit)}</b></div><div class="kpi">Closing Units<b>${totals.stock}</b></div></div>
 <div class="note">Enter the <b>actual total amount collected</b> in Sale Amount. Discounts are automatically reflected in profit.</div>
 <div class="tablewrap"><table><thead><tr><th>Item / Size</th><th>Opening</th><th>Received</th><th>Purchase / pc</th><th>Sold</th><th>Actual Sale ₹</th><th>Closing</th><th>Profit</th></tr></thead><tbody>
 ${rows.map(x=>`<tr><td><span class="itemname">${x.it.name}</span><br><small class="muted">${x.it.size} ml</small></td>
 <td><input type="number" min="0" value="${x.opening}" oninput="setCell('${x.it.id}','opening',this.value)"></td>
 <td><input type="number" min="0" value="${x.received}" oninput="setCell('${x.it.id}','received',this.value)"></td>
 <td><input type="number" min="0" step="0.01" value="${x.purchase}" oninput="setCell('${x.it.id}','purchase',this.value)"></td>
 <td><input type="number" min="0" value="${x.sold}" oninput="setCell('${x.it.id}','sold',this.value)"></td>
 <td><input type="number" min="0" step="0.01" value="${x.sale}" oninput="setCell('${x.it.id}','sale',this.value)"></td>
 <td>${x.closing}</td><td>${money(x.profit)}</td></tr>`).join("")}</tbody></table></div>`;
}
function setCell(id,key,val){
  const rec=getRecord(view.shop,view.date);
  if(!rec[id])rec[id]={};
  rec[id][key]=Number(val)||0;
  state.records[recKey(view.shop,view.date)]=rec;
  save();
  const status=document.getElementById("autosaveStatus");
  if(status){
    status.textContent="✓ Saved";
    clearTimeout(window.autoSaveTimer);
    window.autoSaveTimer=setTimeout(()=>{status.textContent="✓ Auto-saved"},700);
  }
}
function previousClosing(id,shop,date){
  const [m,d]=date.split(" ");
  let mi=months().indexOf(m), day=+d-1;
  let base=0;

  if(day<1){
    mi--;
    if(mi<0) return 0;
    day=daysInMonth(months()[mi]);
  }

  const prev=months()[mi]+" "+String(day).padStart(2,"0");
  const r=state.records[recKey(shop,prev)]?.[id];

  if(r){
    const opening=+r.opening||0;
    const received=+r.received||0;
    const sold=+r.sold||0;
    base=opening+received-sold;
  }

  const it=items.find(x=>x.id===id);
  if(!it) return base;

  // Add/subtract every transfer that occurred before the selected day.
  const targetIndex = months().indexOf(m);
  const targetDay = +d;
  const currentYear = new Date().getFullYear();

  state.transfers.forEach(t=>{
    const td = new Date(t.date + "T23:59:59");
    if(isNaN(td)) return;

    const beforeSelectedDay =
      td.getFullYear() < currentYear ||
      (td.getFullYear() === currentYear &&
       (td.getMonth() < targetIndex ||
        (td.getMonth() === targetIndex && td.getDate() < targetDay)));

    if(!beforeSelectedDay) return;
    if(t.item !== it.name || String(t.size) !== String(it.size)) return;

    if(t.to === shop) base += (+t.qty||0);
    if(t.from === shop) base -= (+t.qty||0);
  });

  return base;
}
function getPreviousDate(date){return date}
function addItemModal(){
 document.getElementById("modalTitle").textContent="Add New Item";
 document.getElementById("modalBody").innerHTML=`<div class="formgrid">

  const id=crypto.randomUUID();items.push({id,name,size,active:true,defaultPurchase:+document.getElementById("newPurchase").value||0});
  if(document.getElementById("newOpening").value) {const r=getRecord(view.shop,view.date);r[id]={opening:+document.getElementById("newOpening").value||0,purchase:+document.getElementById("newPurchase").value||0};}

}

function transfers(a){

 <div class="note">Transfers change stock only. They are not counted as sales or profit.</div>`;
}
function transferModal(){
 document.getElementById("modalTitle").textContent="Transfer Stock";
 document.getElementById("modalBody").innerHTML=`<div class="formgrid">
 <label class="full">Item<select id="trItem">${items.filter(x=>x.active).map(x=>`<option value="${x.id}">${x.name} • ${x.size} ml</option>`).join("")}</select></label>
 <label>From<select id="trFrom">${shops.map(s=>`<option>${s}</option>`).join("")}</select></label>
 <label>To<select id="trTo">${shops.map(s=>`<option>${s}</option>`).join("")}</select></label>
 <label>Quantity<input id="trQty" type="number" min="1" value="1"></label>
 <label>Date<input id="trDate" type="date" value="${new Date().toISOString().slice(0,10)}"></label>
 </div>`;
 document.getElementById("modalSave").onclick=()=>{
  const from=document.getElementById("trFrom").value,to=document.getElementById("trTo").value,qty=+document.getElementById("trQty").value;
  if(from===to)return alert("Choose two different shops.");
  if(!Number.isFinite(qty)||qty<=0)return alert("Enter a valid quantity.");
  const it=items.find(x=>x.id===document.getElementById("trItem").value);
  const transferDate=document.getElementById("trDate").value;
  const dt=new Date(transferDate+"T12:00:00");
  const monthName=months()[dt.getMonth()];
  const dayName=String(dt.getDate()).padStart(2,"0");
  const recordDate=monthName+" "+dayName;

  state.transfers.push({
    date:transferDate,
    item:it.name,
    size:it.size,
    from,
    to,
    qty
  });

  // Record the transfer as stock movement, not as a sale.
  const sourceRec=getRecord(from,recordDate);
  if(!sourceRec[it.id]) sourceRec[it.id]={};
  sourceRec[it.id].transferOut=(+sourceRec[it.id].transferOut||0)+qty;

  const destRec=getRecord(to,recordDate);
  if(!destRec[it.id]) destRec[it.id]={};
  destRec[it.id].received=(+destRec[it.id].received||0)+qty;

  state.records[recKey(from,recordDate)]=sourceRec;
  state.records[recKey(to,recordDate)]=destRec;

  save();closeModal();render();
 };openModal();
}
function reportDates(period){
 const now=new Date();
 const out=[];
 const add=(dt)=>{
   const m=months()[dt.getMonth()];
   const d=String(dt.getDate()).padStart(2,"0");
   out.push({key:m+" "+d,date:dt});
 };
 if(period==="today"){
   add(now);
 }else if(period==="week"){
   for(let i=6;i>=0;i--){let dt=new Date(now);dt.setDate(now.getDate()-i);add(dt);}
 }else{
   const y=now.getFullYear(),m=now.getMonth();
   for(let d=1;d<=new Date(y,m+1,0).getDate();d++) add(new Date(y,m,d));
 }
 return out;
}

function reportData(period, shopFilter="ALL"){
 const dates=new Set(reportDates(period).map(x=>x.key));
 const byItem={};
 let sales=0,profit=0,sold=0,low=0;
 const shopsToUse=shopFilter==="ALL"?shops:[shopFilter];

 Object.entries(state.records).forEach(([key,rec])=>{
   const parts=key.split("|"); if(parts.length!==2)return;
   const shop=parts[0],dateKey=parts[1];
   if(!shopsToUse.includes(shop)||!dates.has(dateKey))return;

   Object.entries(rec).forEach(([id,r])=>{
     const q=+r.sold||0, sale=+r.sale||0, purchase=+r.purchase||0;
     const p=sale-(q*purchase);
     sales+=sale; profit+=p; sold+=q;
     if(!byItem[id])byItem[id]={sold:0,sales:0,profit:0};
     byItem[id].sold+=q;byItem[id].sales+=sale;byItem[id].profit+=p;
   });
 });

 // Current stock estimate: use latest available record per item/shop plus transfers.
 items.filter(x=>x.active).forEach(it=>{
   shopsToUse.forEach(shop=>{
     const keys=Object.keys(state.records).filter(k=>k.startsWith(shop+"|"));
     let latest=null,latestDate=-1;
     keys.forEach(k=>{
       const dateKey=k.split("|")[1];
       const [mn,ds]=dateKey.split(" ");
       const idx=months().indexOf(mn)*32+(+ds);
       if(idx>latestDate && state.records[k][it.id]){
         latestDate=idx;latest={key:k,r:state.records[k][it.id]};
       }
     });
     if(latest){
       const r=latest.r;
       const closing=(+r.opening||0)+(+r.received||0)-(+r.sold||0)-(+r.transferOut||0);
       if(closing>0 && closing<=5) low++;
     }
   });
 });
 return {sales,profit,sold,low,byItem};
}

function reports(a){
 const period=window.reportPeriod||"week";
 const all=reportData(period);
 const rankings=Object.entries(all.byItem).map(([id,x])=>{
   const it=items.find(i=>i.id===id);return {...x,it};
 }).filter(x=>x.it).sort((a,b)=>b.sold-a.sold);
 const profitRank=[...rankings].sort((a,b)=>b.profit-a.profit);
 const shopCards=shops.map(s=>{
   const d=reportData(period,s);
   return `<div class="card"><div class="muted">${s}</div>
   <div class="big">${money(d.sales)}</div>
   <div>Profit: <b>${money(d.profit)}</b></div>
   <div class="muted">${d.sold} units sold</div></div>`;
 }).join("");

 a.innerHTML=`<div class="toolbar">
   <select id="period" onchange="window.reportPeriod=this.value;reports(document.getElementById('app'))">
     <option value="week" ${period==="week"?"selected":""}>This Week</option>
     <option value="month" ${period==="month"?"selected":""}>This Month</option>
     <option value="today" ${period==="today"?"selected":""}>Today</option>
   </select>
 </div>

 <div class="kpis">
   <div class="kpi">Total Sales<b>${money(all.sales)}</b></div>
   <div class="kpi">Total Profit<b>${money(all.profit)}</b></div>
   <div class="kpi">Items Sold<b>${all.sold}</b></div>
   <div class="kpi">Low Stock<b>${all.low}</b></div>
 </div>

 <h3>🏪 Shop Performance</h3>
 <div class="grid">${shopCards}</div>

 <div class="card" style="margin-top:14px">
   <h3>🔥 Fast-Moving Items</h3>
   ${rankings.slice(0,8).map((x,i)=>`
     <p><b>${i+1}. ${x.it.name}</b> <span class="muted">${x.it.size} ml</span>
     <span class="badge good">${x.sold} sold</span></p>`).join("") ||
     `<p class="muted">No sales recorded for this period yet.</p>`}
 </div>

 <div class="card" style="margin-top:14px">
   <h3>🐢 Low-Selling Items</h3>
   ${rankings.slice(-8).reverse().map(x=>`
     <p><b>${x.it.name}</b> <span class="muted">${x.it.size} ml</span>
     <span class="badge warn">${x.sold} sold</span></p>`).join("") ||
     `<p class="muted">No sales recorded for this period yet.</p>`}
 </div>

 <div class="card" style="margin-top:14px">
   <h3>💰 Highest-Profit Items</h3>
   ${profitRank.slice(0,8).map(x=>`
     <p><b>${x.it.name}</b> <span class="muted">${x.it.size} ml</span>
     <span class="badge good">${money(x.profit)}</span></p>`).join("") ||
     `<p class="muted">No profit data for this period yet.</p>`}
 </div>

 <div class="note">Reports are calculated from the daily records you've entered. Transfers are stock movements and are not counted as sales or profit.</div>`;
}

function summaryShop(shop){
 let sales=0,profit=0,sold=0,low=0;
 Object.keys(state.records).filter(k=>k.startsWith(shop+"|")).forEach(k=>Object.values(state.records[k]).forEach(r=>{sales+=+r.sale||0;profit+=(+r.sale||0)-((+r.sold||0)*(+r.purchase||0));sold+=+r.sold||0}));
 items.forEach(it=>{let c=previousClosing(it.id,shop,"December 31");if(c<=5&&c>0)low++});
 return {sales,profit,sold,low};
}
function summaryAll(){let z={sales:0,profit:0,sold:0,low:0};shops.forEach(s=>{let d=summaryShop(s);z.sales+=d.sales;z.profit+=d.profit;z.sold+=d.sold;z.low+=d.low});return z}
function performanceHTML(){
 const agg={};Object.values(state.records).forEach(rec=>Object.entries(rec).forEach(([id,r])=>{if(!agg[id])agg[id]={sold:0,profit:0};agg[id].sold+=+r.sold||0;agg[id].profit+=(+r.sale||0)-((+r.sold||0)*(+r.purchase||0))}));
 const top=Object.entries(agg).sort((a,b)=>b[1].sold-a[1].sold).slice(0,5), low=Object.entries(agg).sort((a,b)=>a[1].sold-b[1].sold).slice(0,5);
 const find=id=>items.find(x=>x.id===id);
 return `<div class="grid"><div><b>🔥 Fast-moving</b>${top.map(([id,x])=>`<p>${find(id)?.name||"Item"} ${find(id)?`(${find(id).size} ml)`:""} <span class="badge good">${x.sold} sold</span></p>`).join("")||"<p class='muted'>Enter sales to see rankings.</p>"}</div>
 <div><b>🐢 Low-selling</b>${low.map(([id,x])=>`<p>${find(id)?.name||"Item"} ${find(id)?`(${find(id).size} ml)`:""} <span class="badge warn">${x.sold} sold</span></p>`).join("")||"<p class='muted'>Enter sales to see rankings.</p>"}</div></div>`;
}
function renderReportPeriod(){reports(document.getElementById("app"))}
function customReport(){alert("Custom date-range reporting is planned for the next prototype step. The current prototype already supports daily, monthly and transfer records.")}
render();
</script>
